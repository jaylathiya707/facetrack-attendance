<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaceTrack - Attendance</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <aside class="sidebar">
        <div class="logo">
            <div class="logo-icon"><i class="fas fa-camera"></i></div>
            <h1>FaceTrack</h1>
        </div>
        <ul class="nav-links">
            <li class="nav-item"><a href="index.html"><i class="fas fa-chart-line"></i> Dashboard</a></li>
            <li class="nav-item"><a href="students.html"><i class="fas fa-user-graduate"></i> Register</a></li>
            <li class="nav-item"><a href="attendance.html" class="active"><i class="fas fa-user-check"></i> Take Attendance</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <div class="header">
            <h2>Take Attendance</h2>
            <div id="alertContainer"></div>
        </div>

        <div style="display: flex; justify-content: center; align-items: center; flex-direction: column;">
            
            <div class="glass-card" style="width: 100%; max-width: 600px; text-align: center; margin-bottom: 2rem;">
                <h3 style="font-family: Outfit; font-size: 1.5rem; margin-bottom: 1rem;">Active Attendance Session</h3>
                
                <div class="camera-container" id="cameraContainer" style="margin-bottom: 1.5rem; display: none;">
                    <video id="videoFeed" autoplay></video>
                    <div class="camera-overlay"></div>
                    <div class="scanner-line"></div>
                </div>

                <div id="startScreen">
                    <i class="fas fa-camera" style="font-size: 4rem; color: var(--primary-color); margin-bottom: 1rem;"></i>
                    <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">Align your face in the center to mark attendance</p>
                    <button class="btn btn-primary" id="startBtn" style="width: 100%; max-width: 300px;"><i class="fas fa-play"></i> Start Camera</button>
                </div>

                <button class="btn btn-success" id="scanBtn" style="display: none; width: 100%; max-width: 300px; margin: 0 auto; background: var(--success); color: white;">
                    <i class="fas fa-crosshairs"></i> Mark Attendance
                </button>
            </div>

            <div class="glass-card" id="resultCard" style="width: 100%; max-width: 600px; display: none;">
                <div style="display: flex; gap: 1rem; align-items: center;">
                    <div id="resultIcon" style="font-size: 3rem;"></div>
                    <div>
                        <h3 id="resultName" style="font-family: Outfit; font-size: 1.5rem;"></h3>
                        <p id="resultId" style="color: var(--text-secondary);"></p>
                        <p id="resultStatus" style="font-weight: bold; margin-top: 0.5rem;"></p>
                    </div>
                </div>
            </div>

        </div>
        <canvas id="canvas" style="display: none;"></canvas>
    </main>

    <script src="js/api.js"></script>
    <script>
        const video = document.getElementById('videoFeed');
        const canvas = document.getElementById('canvas');
        const startBtn = document.getElementById('startBtn');
        const scanBtn = document.getElementById('scanBtn');
        const cameraContainer = document.getElementById('cameraContainer');
        const startScreen = document.getElementById('startScreen');
        const resultCard = document.getElementById('resultCard');
        const alertContainer = document.getElementById('alertContainer');
        let stream = null;

        function showAlert(msg, type='error') {
            alertContainer.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
            setTimeout(()=>alertContainer.innerHTML='', 4000);
        }

        let autoScanInterval = null;
        let isProcessing = false;

        startBtn.addEventListener('click', async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                startScreen.style.display = 'none';
                cameraContainer.style.display = 'block';
                cameraContainer.classList.add('scanning');
                scanBtn.style.display = 'none'; // Hide manual scan button
                
                // Start auto-scanning every 2 seconds
                autoScanInterval = setInterval(performAutoScan, 2000);
            } catch (err) {
                showAlert('Camera access denied.', 'error');
            }
        });

        async function performAutoScan() {
            if (isProcessing) return;
            isProcessing = true;
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const imageBase64 = canvas.toDataURL('image/jpeg');

            try {
                const res = await fetch('http://localhost:5000/api/attendance/mark', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: imageBase64 })
                });
                const data = await res.json();
                
                if(res.ok) {
                    resultCard.style.display = 'block';
                    document.getElementById('resultIcon').innerHTML = '<i class="fas fa-check-circle" style="color: var(--success);"></i>';
                    document.getElementById('resultName').textContent = data.student_name;
                    document.getElementById('resultId').textContent = data.student_id;
                    document.getElementById('resultStatus').textContent = data.status || data.message;
                    document.getElementById('resultStatus').style.color = 'var(--success)';
                    
                    // Hide the success message after 3 seconds so it's ready for the next person
                    setTimeout(() => { resultCard.style.display = 'none'; }, 3000);
                } else {
                    // Only show error if it's not a generic "no face" error to avoid flashing screen
                    if(data.error !== 'No face detected.' && data.error !== 'Face not recognized for the current active sessions.') {
                        resultCard.style.display = 'block';
                        document.getElementById('resultIcon').innerHTML = '<i class="fas fa-times-circle" style="color: var(--danger);"></i>';
                        document.getElementById('resultName').textContent = 'Recognition Failed';
                        document.getElementById('resultId').textContent = '';
                        document.getElementById('resultStatus').textContent = data.error;
                        document.getElementById('resultStatus').style.color = 'var(--danger)';
                        setTimeout(() => { resultCard.style.display = 'none'; }, 2000);
                    }
                }
            } catch (err) {
                // Ignore network errors in auto-scan loop
            } finally {
                isProcessing = false;
            }
        }
    </script>
</body>
</html>
