<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaceTrack - Take Attendance</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <aside class="sidebar">
        <div class="logo">
            <div class="logo-icon"><i class="fas fa-camera"></i></div>
            <h1>FaceTrack</h1>
        </div>
        <ul class="nav-links">
            <li class="nav-item"><a href="index.html"><i class="fas fa-chart-line"></i> Dashboard</a></li>
            <li class="nav-item"><a href="students.html"><i class="fas fa-user-graduate"></i> Students</a></li>
            <li class="nav-item"><a href="attendance.html" class="active"><i class="fas fa-user-check"></i> Take Attendance</a></li>
            <li class="nav-item"><a href="records.html"><i class="fas fa-history"></i> Records & Reports</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <div class="header">
            <h2>Take Attendance</h2>
            <div id="alertContainer"></div>
        </div>

        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 2rem;">
            <!-- Camera Section -->
            <div class="glass-card" style="display: flex; flex-direction: column; align-items: center;">
                <div class="camera-container" id="cameraContainer">
                    <video id="videoFeed" autoplay playsinline></video>
                    <div class="camera-overlay"></div>
                    <div class="scanner-line"></div>
                </div>
                <div style="margin-top: 1.5rem; display: flex; gap: 1rem;">
                    <button id="startCamBtn" class="btn btn-primary"><i class="fas fa-video"></i> Start Camera</button>
                    <button id="stopCamBtn" class="btn btn-secondary" style="display: none;"><i class="fas fa-video-slash"></i> Stop Camera</button>
                    <button id="scanBtn" class="btn btn-primary" style="display: none;">
                        <i class="fas fa-expand"></i> Scan Face
                    </button>
                </div>
                <canvas id="scanCanvas" style="display: none;"></canvas>
            </div>

            <!-- Result Section -->
            <div class="glass-card">
                <h3 style="margin-bottom: 1.5rem; font-family: 'Outfit';">Scan Result</h3>
                
                <div id="loadingResult" style="display: none; text-align: center; padding: 2rem 0;">
                    <div class="loader" style="border-color: var(--primary-color); border-top-color: transparent; width: 40px; height: 40px; margin: 0 auto 1rem;"></div>
                    <p style="color: var(--text-secondary);">Identifying face...</p>
                </div>

                <div id="resultCard" style="display: none; text-align: center;">
                    <div id="resultIcon" style="font-size: 4rem; margin-bottom: 1rem;"></div>
                    <h2 id="resultName" style="font-family: 'Outfit'; margin-bottom: 0.5rem;"></h2>
                    <p id="resultId" style="color: var(--text-secondary); margin-bottom: 1.5rem; font-size: 1.1rem;"></p>
                    
                    <div style="background: rgba(0,0,0,0.2); padding: 1rem; border-radius: 8px; text-align: left;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                            <span style="color: var(--text-secondary);">Date:</span>
                            <span id="resultDate" style="font-weight: 500;"></span>
                        </div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                            <span style="color: var(--text-secondary);">Time:</span>
                            <span id="resultTime" style="font-weight: 500;"></span>
                        </div>
                        <div style="display: flex; justify-content: space-between;">
                            <span style="color: var(--text-secondary);">Status:</span>
                            <span id="resultStatus" class="badge"></span>
                        </div>
                    </div>
                </div>

                <div id="idleState" style="text-align: center; padding: 3rem 0; color: var(--text-secondary);">
                    <i class="fas fa-user-circle" style="font-size: 4rem; margin-bottom: 1rem; opacity: 0.5;"></i>
                    <p>Ready to scan.</p>
                    <p style="font-size: 0.9rem; margin-top: 0.5rem;">Position face within the circle and click Scan.</p>
                </div>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/attendance.js"></script>
</body>
</html>
