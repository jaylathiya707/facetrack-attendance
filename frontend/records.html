<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaceTrack - Records</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <aside class="sidebar">
        <div class="logo">
            <div class="logo-icon"><i class="fas fa-camera"></i></div>
            <h1>FaceTrack</h1>
        </div>
        <ul class="nav-links">
            <li class="nav-item"><a href="index.html"><i class="fas fa-chart-line"></i> Dashboard</a></li>
            <li class="nav-item"><a href="students.html"><i class="fas fa-user-graduate"></i> Students</a></li>
            <li class="nav-item"><a href="attendance.html"><i class="fas fa-user-check"></i> Take Attendance</a></li>
            <li class="nav-item"><a href="records.html" class="active"><i class="fas fa-history"></i> Records & Reports</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <div class="header">
            <h2>Attendance Records</h2>
            <div id="alertContainer"></div>
        </div>

        <div class="glass-card" style="margin-bottom: 2rem;">
            <div style="display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap;">
                <div class="form-group">
                    <label>Date Filter</label>
                    <input type="date" id="dateFilter" class="form-control">
                </div>
                <div class="form-group">
                    <label>Search Student</label>
                    <input type="text" id="searchFilter" class="form-control" placeholder="Name or ID...">
                </div>
                <div class="form-group">
                    <label>Division</label>
                    <select id="divFilter" class="form-control">
                        <option value="">All</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                    </select>
                </div>
                <button class="btn btn-secondary" id="resetFilters" style="margin-bottom: 0px;"><i class="fas fa-undo"></i> Reset</button>
                <button class="btn btn-primary" id="exportBtn" style="margin-bottom: 0px; margin-left: auto;"><i class="fas fa-download"></i> Export CSV</button>
            </div>
        </div>

        <div class="glass-card">
            <div class="table-container">
                <table id="recordsTable">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Student ID</th>
                            <th>Name</th>
                            <th>Division</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="recordsTableBody">
                        <tr><td colspan="6" style="text-align:center;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/records.js"></script>
</body>
</html>
