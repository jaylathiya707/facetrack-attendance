<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaceTrack - Student Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-container { display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-box { width: 100%; max-width: 400px; padding: 2rem; border-radius: 16px; text-align: center; }
        .dashboard-container { display: none; }
        .dashboard-container.active { display: flex; }
    </style>
</head>
<body>

    <!-- Student Login View -->
    <div id="loginView" class="login-container">
        <div class="login-box glass-card">
            <div class="logo" style="justify-content: center; margin-bottom: 2rem;">
                <div class="logo-icon"><i class="fas fa-camera"></i></div>
                <h1>FaceTrack</h1>
            </div>
            <h2 style="margin-bottom: 1rem; font-family: Outfit;">Student Login</h2>
            <div id="loginAlert"></div>
            <form id="studentLoginForm">
                <div class="form-group" style="margin-bottom: 1.5rem; text-align: left;">
                    <label>Enrollment Number</label>
                    <input type="text" id="enrollment" class="form-control" required placeholder="Enter Enrollment No">
                </div>
                <div class="form-group" style="margin-bottom: 1.5rem; text-align: left;">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control" required placeholder="Enter Password">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
                <div style="margin-top: 1rem;">
                    <a href="students.html" style="color: var(--text-secondary); text-decoration: none; font-size: 0.9rem;">Register Face Data</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Student Dashboard View -->
    <div id="dashboardView" class="dashboard-container">
        <aside class="sidebar">
            <div class="logo">
                <div class="logo-icon"><i class="fas fa-camera"></i></div>
                <h1>FaceTrack</h1>
            </div>
            <ul class="nav-links">
                <li class="nav-item"><a href="#" class="active"><i class="fas fa-chart-line"></i> Dashboard</a></li>
                <li class="nav-item"><a href="attendance.html"><i class="fas fa-user-check"></i> Take Attendance</a></li>
                <li class="nav-item"><a href="#" onclick="studentLogout()"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="header">
                <h2>Student Dashboard</h2>
                <div><span id="studentNameDisplay" style="font-weight: 600; font-size: 1.2rem;"></span> <span id="studentIdDisplay" style="color: var(--text-secondary);"></span></div>
            </div>

            <div class="glass-card" style="margin-bottom: 2rem;">
                <div style="display: flex; gap: 2rem; align-items: center;">
                    <div style="width: 80px; height: 80px; border-radius: 50%; background: var(--primary-color); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: bold; color: white;" id="studentInitial">S</div>
                    <div>
                        <h3 style="font-family: Outfit; font-size: 1.5rem; margin-bottom: 0.5rem;" id="profileName">Student Name</h3>
                        <p style="color: var(--text-secondary); margin-bottom: 0.25rem;"><i class="fas fa-id-card"></i> <span id="profileEnr"></span></p>
                        <p style="color: var(--text-secondary); margin-bottom: 0.25rem;"><i class="fas fa-building"></i> <span id="profileBranch"></span> - Division <span id="profileDiv"></span></p>
                        <p style="color: var(--text-secondary);"><i class="fas fa-graduation-cap"></i> Semester <span id="profileSem"></span></p>
                    </div>
                </div>
            </div>

            <div class="stats-grid">
                <div class="glass-card stat-card">
                    <div class="stat-icon primary"><i class="fas fa-book"></i></div>
                    <div class="stat-info"><h3>Total Classes</h3><p id="stat-total">0</p></div>
                </div>
                <div class="glass-card stat-card">
                    <div class="stat-icon success"><i class="fas fa-check-circle"></i></div>
                    <div class="stat-info"><h3>Present</h3><p id="stat-present">0</p></div>
                </div>
                <div class="glass-card stat-card">
                    <div class="stat-icon danger"><i class="fas fa-times-circle"></i></div>
                    <div class="stat-info"><h3>Absent</h3><p id="stat-absent">0</p></div>
                </div>
                <div class="glass-card stat-card">
                    <div class="stat-icon warning"><i class="fas fa-percentage"></i></div>
                    <div class="stat-info"><h3>Attendance %</h3><p id="stat-percent">0%</p></div>
                </div>
            </div>

            <div class="glass-card">
                <h3 style="margin-bottom: 1.5rem; font-family: 'Outfit';">Attendance History</h3>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Time</th>
                                <th>Subject</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="recentAttendanceTable">
                            <tr><td colspan="4" style="text-align:center;">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
