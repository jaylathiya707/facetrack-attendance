<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaceTrack - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo">
            <div class="logo-icon"><i class="fas fa-camera"></i></div>
            <h1>FaceTrack</h1>
        </div>
        <ul class="nav-links">
            <li class="nav-item"><a href="index.html" class="active"><i class="fas fa-chart-line"></i> Dashboard</a></li>
            <li class="nav-item"><a href="students.html"><i class="fas fa-user-graduate"></i> Students</a></li>
            <li class="nav-item"><a href="attendance.html"><i class="fas fa-user-check"></i> Take Attendance</a></li>
            <li class="nav-item"><a href="records.html"><i class="fas fa-history"></i> Records & Reports</a></li>
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <div class="header">
            <h2>Dashboard</h2>
            <div id="alertContainer"></div>
        </div>

        <div class="stats-grid">
            <div class="glass-card stat-card">
                <div class="stat-icon primary"><i class="fas fa-users"></i></div>
                <div class="stat-info">
                    <h3>Total Students</h3>
                    <p id="totalStudents">--</p>
                </div>
            </div>
            <div class="glass-card stat-card">
                <div class="stat-icon success"><i class="fas fa-check-circle"></i></div>
                <div class="stat-info">
                    <h3>Present Today</h3>
                    <p id="presentToday">--</p>
                </div>
            </div>
            <div class="glass-card stat-card">
                <div class="stat-icon danger"><i class="fas fa-times-circle"></i></div>
                <div class="stat-info">
                    <h3>Absent Today</h3>
                    <p id="absentToday">--</p>
                </div>
            </div>
            <div class="glass-card stat-card">
                <div class="stat-icon warning"><i class="fas fa-percentage"></i></div>
                <div class="stat-info">
                    <h3>Attendance %</h3>
                    <p id="attendancePercentage">--%</p>
                </div>
            </div>
        </div>

        <div class="glass-card">
            <h3 style="margin-bottom: 1.5rem; font-family: 'Outfit'; font-size: 1.2rem;">Recent Attendance</h3>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Student ID</th>
                            <th>Name</th>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="recentAttendanceTable">
                        <tr><td colspan="5" style="text-align:center;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
